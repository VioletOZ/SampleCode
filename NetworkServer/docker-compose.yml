# OZServer 실행에 필요한 MySQL + Redis (서버 자체는 Windows에서 빌드/실행)
#   1) .env.example을 .env로 복사하고 비밀번호를 채운다(.env는 git에 올리지 않음)
#   2) docker compose up -d
#   3) OZServer/server.conf의 db.user / db.password를 .env의 MYSQL_USER / MYSQL_PASSWORD와 맞춘다
# 이미 PC에 MySQL(3306/33060)이나 Redis(6379)가 떠 있으면 포트가 겹치므로, 끄거나 .env에서 호스트 포트를 바꾼다
# (바꾼 경우 server.conf의 db.port / redis.port도 같이 바꾼다).
services:
  mysql:
    image: mysql:8.0
    container_name: ozserver-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: account
      MYSQL_USER: ${MYSQL_USER:-ozserver}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"      # 일반 SQL(관리/확인용)
      - "${MYSQL_X_PORT:-33060}:33060"  # X Plugin — 서버(X DevAPI)가 쓰는 포트
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro   # 데이터 볼륨이 비어 있을 때 1회 실행
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ozserver-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]   # 캐시 전용(원본은 MySQL) -> 디스크 저장 없음
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
